# Tests every push and pull request and builds the Docker image for amd64 and
# arm64, each on its own native runner (no emulation). Only once the tests
# pass is the image published, to Docker Hub and GitHub Container Registry.
#
#   push to main  → :edge and :sha-<commit>
#   tag v1.2.3    → :1.2.3, :1.2, :1, :latest, given to the image already
#                   built for that commit on main (nothing is rebuilt or
#                   retested; the tag waits for main's run if it's still going)
#   pull request  → tests and a test build, nothing published
#
# So tag a commit that is (or is being) pushed to main, as `npm version` +
# `git push --follow-tags` does.
#
# Needs two repository secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
# (a Docker Hub access token with read/write scope).

name: Test and build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read
  packages: write

# A newer push to a pull request replaces its older run. On main every commit
# finishes, since a tag may be waiting for its image.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The API tests twice over, side by side: images on disk and in S3.
    strategy:
      matrix:
        storage: [disk, s3]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bookplate
          POSTGRES_PASSWORD: bookplate
          POSTGRES_DB: bookplate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookplate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # A fake mail server: the password-reset tests read its inbox.
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
      # S3-compatible storage: the storage tests, and the API tests on S3.
      rustfs:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: bookplate
          RUSTFS_SECRET_KEY: bookplate-secret
        ports:
          - 9000:9000
    env:
      TEST_DATABASE_ADMIN_URL: postgres://bookplate:bookplate@localhost:5432/bookplate
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        if: matrix.storage == 'disk'
        run: npm run lint
      - name: Typecheck
        if: matrix.storage == 'disk'
        run: npx tsc --noEmit
      - name: Unit tests
        if: matrix.storage == 'disk'
        run: npm test
      - name: Build
        run: npm run build
      - name: API tests (images on disk)
        if: matrix.storage == 'disk'
        run: npm run test:api
      - name: API tests (images in S3)
        if: matrix.storage == 's3'
        run: npm run test:api:s3

  # Each platform on its own runner, alongside the tests. On main the result is
  # pushed by digest only, untagged, so nothing can pull it until `publish`
  # names it after the tests pass.
  build:
    if: github.ref_type != 'tag'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/bookplate
      GHCR_REPO: ghcr.io/${{ github.repository_owner }}/bookplate
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_REPO }}
            ${{ env.GHCR_REPO }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: ${{ env.PUSH == 'true' && format('type=image,"name={0},{1}",push-by-digest=true,name-canonical=true,push=true', env.DOCKERHUB_REPO, env.GHCR_REPO) || 'type=cacheonly' }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Keep the digest for publish
        if: env.PUSH == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        if: env.PUSH == 'true'
        with:
          name: digest-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Both platforms joined into one image and tagged, once the tests pass.
  publish:
    if: github.event_name == 'push' && github.ref_type != 'tag'
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/bookplate
      GHCR_REPO: ghcr.io/${{ github.repository_owner }}/bookplate
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_REPO }}
            ${{ env.GHCR_REPO }}
          tags: |
            type=edge,branch=main
            type=sha

      - name: Join the platforms and tag
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$DOCKERHUB_REPO@sha256:%s " *)

  # A release: the version tags go on the image main already built and tested
  # for this commit.
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/bookplate
      GHCR_REPO: ghcr.io/${{ github.repository_owner }}/bookplate
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_REPO }}
            ${{ env.GHCR_REPO }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # The tagged commit, read from git: an annotated tag has its own SHA.
      - uses: actions/checkout@v4

      # main's run for the same commit is usually still going: wait for its image.
      - name: Wait for main's image of this commit
        run: |
          source="$DOCKERHUB_REPO:sha-$(git rev-parse --short=7 HEAD)"
          for _ in $(seq 80); do
            if docker buildx imagetools inspect "$source" >/dev/null 2>&1; then
              echo "SOURCE=$source" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 30
          done
          echo "::error::No image $source after 40 minutes. Did main's run for this commit fail, or was the commit never pushed to main?"
          exit 1

      - name: Tag the release
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "$SOURCE"
