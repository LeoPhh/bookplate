# Postgres for local development: `npm run db:up`, then `npm run dev`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bookplate
      POSTGRES_PASSWORD: bookplate
      POSTGRES_DB: bookplate
    ports:
      - "5433:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data

volumes:
  pgdata-dev:
