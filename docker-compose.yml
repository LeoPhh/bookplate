# Bookplate — self-hosted reading tracker.
#
#   1. Put this file and .env (copied from .env.example) in a folder.
#   2. Fill in .env — at least AUTH_SECRET, DB_PASSWORD and PUBLIC_URL.
#   3. docker compose up -d, then open PUBLIC_URL and create your account.

name: bookplate

# Docker keeps each container's output; rotate it so it can't fill the disk
# (`docker compose logs` reads it).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  bookplate:
    image: ${BOOKPLATE_IMAGE:-leophh/bookplate}:${BOOKPLATE_VERSION:-latest}
    restart: unless-stopped
    logging: *logging
    ports:
      - "${BOOKPLATE_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://bookplate:${DB_PASSWORD:?set DB_PASSWORD in .env}@postgres:5432/bookplate
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      REGISTRATION: ${REGISTRATION:-closed}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      STORAGE: ${STORAGE:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      S3_PREFIX: ${S3_PREFIX:-}
      SIGNUP_BOT_CHECK: ${SIGNUP_BOT_CHECK:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      LIMIT_BOOKS: ${LIMIT_BOOKS:-}
      LIMIT_WORDS: ${LIMIT_WORDS:-}
      LIMIT_STORAGE_MB: ${LIMIT_STORAGE_MB:-}
      LIMIT_UPLOAD_MB: ${LIMIT_UPLOAD_MB:-}
      LIMIT_IMPORT_MB: ${LIMIT_IMPORT_MB:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: bookplate
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: bookplate
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookplate -d bookplate"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  uploads:
  pgdata:
